<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Document pipeline demo</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">ai-document-pipeline-demo</div>
    <nav>
      <a href="/tools/schema-builder/">schema-builder</a>
      <a href="/tools/clean-export/">clean-export</a>
      <a href="/sample/fake_catalogue.pdf" target="_blank" rel="noopener">sample PDF</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="card">
      <h1>Extract → review → confirm</h1>
      <p class="lead">
        Default path is instant mock extract from <code>sample/</code>.
        Optional path runs OCR per page then Ollama <code>llama3.2</code>.
      </p>
      <div class="toolbar">
        <input type="file" id="file" accept=".pdf,image/*" />
        <button type="button" id="extractMock">Extract (Mock)</button>
        <button type="button" id="extractOcr" class="secondary">Extract (OCR + Ollama)</button>
        <button type="button" id="confirm">Confirm save</button>
        <button type="button" id="reload" class="ghost">Reload saved</button>
        <button type="button" id="clear" class="ghost">Clear DB</button>
      </div>
      <div id="msg" class="status">Ready.</div>
    </section>

    <section class="card">
      <h2 class="section-title">Review table</h2>
      <table class="data">
        <thead>
          <tr>
            <th>name</th><th>sku</th><th>watt</th><th>price</th><th>currency</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </section>

    <section class="card">
      <h2 class="section-title">Saved in SQLite</h2>
      <pre id="saved" class="panel"></pre>
    </section>
  </main>

  <script>
    let products = [];
    let extractSource = "mock";

    function setStatus(text, kind) {
      const el = document.getElementById("msg");
      el.className = "status" + (kind ? " " + kind : "");
      el.innerHTML = text;
    }

    function render() {
      const tb = document.getElementById("tbody");
      tb.innerHTML = "";
      products.forEach((p, i) => {
        const tr = document.createElement("tr");
        ["name", "sku", "watt", "price", "currency"].forEach((k) => {
          const td = document.createElement("td");
          const inp = document.createElement("input");
          inp.value = p[k] ?? "";
          inp.addEventListener("input", () => {
            products[i][k] = k === "watt" || k === "price" ? Number(inp.value) : inp.value;
          });
          td.appendChild(inp);
          tr.appendChild(td);
        });
        tb.appendChild(tr);
      });
    }

    async function loadSaved() {
      const res = await fetch("/api/products");
      const data = await res.json();
      document.getElementById("saved").textContent = JSON.stringify(data.products, null, 2);
    }

    async function runMock() {
      setStatus('<span class="spinner"></span>Loading mock extract…', "busy");
      const f = document.getElementById("file").files[0];
      let res;
      if (f) {
        const fd = new FormData();
        fd.append("file", f);
        res = await fetch("/api/extract", { method: "POST", body: fd });
      } else {
        res = await fetch("/api/extract/mock");
      }
      const data = await res.json();
      if (!res.ok) {
        setStatus(data.detail || "extract failed", "err");
        return;
      }
      products = data.products || [];
      extractSource = "mock";
      setStatus("Mock extract loaded (" + products.length + " rows). Edit then Confirm.", "ok");
      render();
    }

    async function runOcrLlm() {
      const f = document.getElementById("file").files[0];
      if (!f) {
        setStatus("Choose a PDF first (try sample/fake_catalogue.pdf).", "err");
        return;
      }
      setStatus('<span class="spinner"></span>OCR + Ollama running (may take a minute)…', "busy");
      const fd = new FormData();
      fd.append("file", f);
      const res = await fetch("/api/extract/ocr-llm", { method: "POST", body: fd });
      const data = await res.json();
      if (!res.ok) {
        setStatus(data.detail || "OCR/LLM extract failed", "err");
        return;
      }
      products = data.products || [];
      extractSource = "ocr_llm";
      const pages = (data.pages || []).length;
      setStatus(
        "OCR+Ollama loaded " + products.length + " products from " + pages + " page(s). Edit then Confirm.",
        "ok"
      );
      render();
    }

    document.getElementById("extractMock").onclick = runMock;
    document.getElementById("extractOcr").onclick = runOcrLlm;

    document.getElementById("confirm").onclick = async () => {
      const res = await fetch("/api/confirm", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ products, source: extractSource }),
      });
      const data = await res.json();
      setStatus(res.ok ? "Saved " + data.saved : (data.detail || "save failed"), res.ok ? "ok" : "err");
      await loadSaved();
    };

    document.getElementById("reload").onclick = loadSaved;
    document.getElementById("clear").onclick = async () => {
      await fetch("/api/products", { method: "DELETE" });
      setStatus("DB cleared", "ok");
      await loadSaved();
    };

    loadSaved();
  </script>
</body>
</html>
