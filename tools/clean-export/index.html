<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>clean-export</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">clean-export</div>
    <nav>
      <a href="/">pipeline</a>
      <a href="/tools/schema-builder/">schema-builder</a>
      <a href="/sample/fake_extraction_raw.xlsx">raw sample</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="card">
      <h1>clean-export</h1>
      <p class="lead">
        Buckets rows from <code>sample/fake_extraction_raw.xlsx</code>:
        ok / null_date / null_amount / error. Writes CSV + cleaned.xlsx under
        <code>data/exports/</code>.
      </p>
      <div class="toolbar">
        <button type="button" id="preview">Preview</button>
        <button type="button" id="run" class="secondary">Run export</button>
      </div>
      <pre id="out" class="panel"></pre>
    </section>
  </main>

  <script>
    document.getElementById("preview").onclick = async () => {
      const res = await fetch("/api/clean-export/preview");
      document.getElementById("out").textContent = JSON.stringify(await res.json(), null, 2);
    };
    document.getElementById("run").onclick = async () => {
      const res = await fetch("/api/clean-export/run", { method: "POST" });
      document.getElementById("out").textContent = JSON.stringify(await res.json(), null, 2);
    };
  </script>
</body>
</html>
